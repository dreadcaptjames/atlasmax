<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ATLAS MAX browser regression tests</title><style>body{font:14px system-ui;background:#0d141e;color:#eee;margin:20px}button,select{padding:10px;background:#233046;color:white;border:1px solid #567}pre{white-space:pre-wrap}iframe{display:block;border:1px solid #456;height:850px;margin-top:20px;max-width:none}.pass{color:#9dcaab}.fail{color:#f99}</style></head><body><h1>ATLAS MAX browser regression tests</h1><p>Run from a static server. Tests use a disposable build in the frame; no remote service is contacted.</p><select id="viewport"><option value="1280">Desktop · 1280px</option><option value="768">Tablet · 768px</option><option value="390">Phone · 390px</option></select> <button id="run">Run tests</button><pre id="log" role="status"></pre><iframe id="app" title="Test application" width="1280"></iframe><script type="module">
const frame=document.querySelector('#app'),log=document.querySelector('#log'),button=document.querySelector('#run');let passed=0;
function assert(value,name){if(!value)throw Error(name);passed++;log.textContent+=`PASS ${name}\n`;}
const pause=()=>new Promise(r=>setTimeout(r,40));
async function until(fn){for(let i=0;i<800;i++){if(fn())return;await pause();}throw Error('Timed out waiting for optimizer');}
async function load(){const dev=await fetch('../dist/index.html',{method:'HEAD'});frame.src=dev.ok?'../dist/index.html':'../index.html';await new Promise(r=>frame.onload=r);await until(()=>frame.contentDocument.querySelector('#equipment-nav button'));}
button.onclick=async()=>{button.disabled=true;log.textContent='';passed=0;frame.width=document.querySelector('#viewport').value;try{await load();const d=frame.contentDocument,w=frame.contentWindow,$=s=>d.querySelector(s),click=s=>{const e=$(s);if(!e)throw Error('Missing control '+s);e.click();},change=(s,v)=>{$(s).value=v;$(s).dispatchEvent(new w.Event('change',{bubbles:true}));},add=id=>click(`[data-tech="${id}"][data-delta="1"]`);assert(d.querySelectorAll('.slot.sc').length===0,'fresh supercharged positions are empty');assert(d.documentElement.scrollWidth<=w.innerWidth+1,'page fits viewport; grid has its own scroller');
for(const eq of ['exosuit','multitool','starship','freighter','exocraft','corvette']){click(`[data-equipment="${eq}"]`);assert($('#grid-title').textContent.toLowerCase().includes(eq==='multitool'?'multi-tool':eq),'category '+eq);for(const option of [...$('#goal').options]){change('#goal',option.value);assert($('#goal').value===option.value,eq+' goal '+option.value);}}
click('[data-equipment="starship"]');click('#reset');add('ship-hyperdrive-upgrade');add('ship-hyperdrive-upgrade');add('ship-hyperdrive-upgrade');add('ship-hyperdrive-upgrade');assert(d.querySelectorAll('.slot.installed').length===4,'dependency core added and upgrade limit enforced');change('#goal','range');click('[data-mode="supercharged"]');for(const p of [0,9,50,59])click(`[data-slot="${p}"]`);assert(d.querySelectorAll('.slot.sc').length===4,'manual SC marking');click('[data-slot="1"]');assert(d.querySelectorAll('.slot.sc').length===4,'SC class limit');click('#optimize');await until(()=>!$('#optimize').disabled);assert($('#feedback').textContent.includes('each present exactly once'),'worker optimizer completed');assert([...d.querySelectorAll('.slot.sc')].every(el=>el.textContent.includes('HYP')),'travel priority assigned to SC');
const before=$('#grid').innerHTML;click('[data-theme="Korvax"]');assert($('#grid').innerHTML===before,'theme preserves layout');click('[data-mode="pin"]');click('[data-slot="0"]');assert($('.slot.pinned'),'pin control');click('[data-slot="0"]');click('[data-mode="move"]');click('[data-slot="0"]');click('[data-slot="1"]');assert($('[data-slot="1"]').classList.contains('installed'),'move/swap control');click('[data-mode="blocked"]');click('[data-slot="2"]');assert($('[data-slot="2"]').classList.contains('blocked'),'block control');click('[data-mode="inspect"]');click('[data-slot="1"]');assert($('#inspector').open,'module inspector opens');$('#module-label').value='Regression module';click('#save-module');assert(!$('#inspector').open,'module details save');
const downloads=[];const original=w.HTMLAnchorElement.prototype.click;w.HTMLAnchorElement.prototype.click=function(){downloads.push({name:this.download,url:this.href});};click('#backup');assert(downloads.length===1,'JSON download generated');const json=await (await fetch(downloads[0].url)).text();assert(JSON.parse(json).supercharged.length===4,'JSON preserves explicit SC');click('#pdf');assert(downloads.length===2,'PDF download generated');const pdf=await (await fetch(downloads[1].url)).text();assert(pdf.startsWith('%PDF-1.4'),'PDF has valid header');w.HTMLAnchorElement.prototype.click=original;
click('#reset');assert(d.querySelectorAll('.slot.sc').length===0,'reset clears SC');const transfer=new w.DataTransfer();transfer.items.add(new w.File([json],'build.json',{type:'application/json'}));$('#import').files=transfer.files;$('#import').dispatchEvent(new w.Event('change',{bubbles:true}));await until(()=>$('#feedback').textContent.includes('restored'));assert(d.querySelectorAll('.slot.sc').length===4,'file import restores explicit SC');
click('[data-equipment="corvette"]');click('#reset');for(let i=0;i<3;i++)click('[data-part="titan-class-hab"][data-delta="1"]');click('[data-part="medusa-class-reactor"][data-delta="1"]');click('[data-part="ceto-class-reactor"][data-delta="1"]');click('[data-part="tractor-beam"][data-delta="1"]');assert($('#construction-summary').textContent.includes('6 mapped technology slots'),'Corvette generated quantities');click('#optimize');await until(()=>!$('#optimize').disabled);assert($('#analysis').textContent.includes('Habitation · 3Connected'),'Corvette habitation connected');assert($('#analysis').textContent.includes('Reactor · 2Connected'),'Corvette reactors connected');click('#help');assert($('#manual').open,'manual opens');$('#manual .close').click();assert(!$('#manual').open,'manual closes');assert($('a.companion').target==='_blank','companion opens new tab');
log.textContent+=`\n${passed} browser checks passed at ${frame.width}px.`;log.className='pass';}catch(e){log.textContent+='\nFAIL '+e.message;log.className='fail';}finally{button.disabled=false;}};
</script></body></html>
